services:
  - type: web
    name: adarsh-school
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile; pnpm --filter @workspace/school-website --filter @workspace/api-server run build
    startCommand: pnpm start
    envVars:
      - key: PORT
        value: 10000
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VITE_GROQ_API_KEY
        sync: false